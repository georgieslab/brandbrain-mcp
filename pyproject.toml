[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brandbrain-mcp"
version = "0.1.0"
description = "A Production Model Context Protocol Server for Creative & Brand Operations using AWS Bedrock and ChromaDB"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "BrandBrain Team" }
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "chromadb>=0.5.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
brandbrain-mcp = "src.server:main"
brandbrain-seed = "src.seed:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
